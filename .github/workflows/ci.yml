name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore backend/TodoApi.Tests
      - run: dotnet build backend/TodoApi.Tests --no-restore -c Release
      - run: dotnet test backend/TodoApi.Tests --no-build -c Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build -- --configuration production

  publish-image:
    # Only on main, and only if both jobs pass
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push multi-arch API image
        uses: docker/build-push-action@v6
        with:
          context: backend/TodoApi
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/todo-api:latest
            ghcr.io/${{ github.repository }}/todo-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # deploy:
  #   needs: publish-image
  #   environment: production      # add required reviewers for a manual approval gate
  #   runs-on: ubuntu-latest
  #   steps:
  #     - run: echo "Deploy ghcr.io/${{ github.repository }}/todo-api:${{ github.sha }} to your host here"
