services:
  db:
    image: postgres:16-alpine          # native arm64 image
    environment:
      POSTGRES_DB: tododb
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d tododb"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:                                  # optional: run the API in Docker too
    build: ./backend/TodoApi
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=tododb;Username=todo;Password=todo_pass"
    ports:
      - "5080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
